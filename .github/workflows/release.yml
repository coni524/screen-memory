# Builds the macOS DMG and the Windows installer, then attaches both to a draft
# GitHub release. Push a version tag to start it:
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# The tag must match [package] version in client-rs/Cargo.toml; the first job
# fails the run when the two disagree. The release is left as a draft so the two
# artifacts can be installed and smoke tested before anyone else can download
# them. workflow_dispatch builds the same artifacts without touching releases.
#
# The macOS job needs these repository secrets
# (Settings > Secrets and variables > Actions):
#   APPLE_SIGNING_IDENTITY  "Developer ID Application: <name> (<team id>)"
#   APPLE_CERT_P12_BASE64   base64 of the Developer ID certificate exported as .p12
#   APPLE_CERT_PASSWORD     password set on that .p12 export
#   APPLE_ID                Apple ID used for notarization
#   APPLE_TEAM_ID           10-character team id
#   APPLE_APP_PASSWORD      app-specific password for that Apple ID
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' client-rs/Cargo.toml | head -1)
          tag=${GITHUB_REF_NAME#v}
          if [ "$crate" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load the certificate and the notarization credentials
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # The certificate is invisible to codesign and to the find-identity
          # check in build-app.sh unless the keychain is on the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          # Without this, codesign stops at a keychain access prompt that nobody
          # can answer on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          xcrun notarytool store-credentials screen-memory-notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Build, sign, and notarize the DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          NOTARY_KEYCHAIN="$RUNNER_TEMP/build.keychain-db" \
            client-rs/packaging/make-dmg.sh "$APPLE_SIGNING_IDENTITY" screen-memory-notary

      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: client-rs/dist/*.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: client-rs\packaging\build-installer.ps1

      - name: Collect the installer
        run: |
          $exe = @("client-rs\packaging\dist", "client-rs\dist") |
            Where-Object { Test-Path $_ } |
            ForEach-Object { Get-ChildItem $_ -Filter "screen-memory-setup-*.exe" } |
            Select-Object -First 1
          if (-not $exe) { throw "no screen-memory-setup-*.exe was produced" }
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          Copy-Item $exe.FullName installer\

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: installer/*.exe
          if-no-files-found: error

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft
